# AnomaFlow v2.0 — Configuration Ruff
# https://docs.astral.sh/ruff/

line-length = 100
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle erreurs
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit (sécurité)
    "RUF", # règles ruff spécifiques
]
ignore = [
    "S101",  # assert autorisé dans les tests
    "B008",  # Depends() dans les paramètres FastAPI
    "E501",  # longueur de ligne (gérée par le formatter)
]

[lint.per-file-ignores]
"tests/*" = ["S101", "S106"]  # assert + mots de passe hardcodés dans les tests OK

[format]
quote-style = "double"
indent-style = "space"
